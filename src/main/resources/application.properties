# ═══════════════════════════════════════════════════════════
# КОНФІГУРАЦІЯ ЗАСТОСУНКУ SMARTSCHOOL
# ═══════════════════════════════════════════════════════════

# ── Сервер ───────────────────────────────────────────────────
server.port=8080

# ── Thymeleaf ────────────────────────────────────────────────
spring.thymeleaf.cache=false

# ── Локалізація ──────────────────────────────────────────────
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# ═══════════════════════════════════════════════════════════
# БАЗА ДАНИХ (H2)
# ═══════════════════════════════════════════════════════════

# URL підключення до H2 у файловому режимі.
# Дані зберігаються у ./data/smartschool.mv.db і не зникають при перезапуску.
spring.datasource.url=jdbc:h2:file:./data/smartschool
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console — веб-інтерфейс для перегляду БД (доступний за адресою /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ═══════════════════════════════════════════════════════════
# JPA / HIBERNATE
# ═══════════════════════════════════════════════════════════

# Стратегія створення таблиць:
#   create       — кожен раз створює нові таблиці (втрачає дані)
#   create-drop  — створює і видаляє при зупинці
#   update       — оновлює структуру не видаляючи дані (рекомендовано для розробки)
#   validate     — перевіряє відповідність схеми (для production)
spring.jpa.hibernate.ddl-auto=update

# Показувати SQL-запити в консолі (зручно при розробці)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Відкласти ініціалізацію JPA до завершення створення схеми
spring.jpa.defer-datasource-initialization=true

# ═══════════════════════════════════════════════════════════
# ЛОГУВАННЯ
# ═══════════════════════════════════════════════════════════

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.ua.edu.smartschool=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework=WARN

# ═══════════════════════════════════════════════════════════
# ACTUATOR (моніторинг)
# ═══════════════════════════════════════════════════════════

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.metrics.access=unrestricted