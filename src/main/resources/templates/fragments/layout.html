<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'SmartSchool'">SmartSchool</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Власні стилі -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- ═══════════════════════════════════
     ШАПКА З НАВІГАЦІЄЮ
     ═══════════════════════════════════ -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center" th:href="@{/}">
            <i class="bi bi-mortarboard-fill me-2 fs-4"></i>
            <span>SmartSchool</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">
                        <i class="bi bi-house-door me-1"></i> Головна
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/about}">
                        <i class="bi bi-info-circle me-1"></i> Контакти
                    </a>
                </li>
            </ul>

            <ul class="navbar-nav">
                <!-- Якщо НЕ авторизований -->
                <li class="nav-item" th:if="${currentUser == null}">
                    <a class="nav-link" th:href="@{/login}">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Вхід
                    </a>
                </li>
                <li class="nav-item" th:if="${currentUser == null}">
                    <a class="btn btn-light btn-sm ms-2 fw-semibold" th:href="@{/register}">
                        Реєстрація
                    </a>
                </li>

                <!-- Якщо авторизований -->
                <li class="nav-item dropdown" th:if="${currentUser != null}">
                    <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#">
                        <i class="bi bi-person-circle me-1"></i>
                        <span th:text="${currentUser.fullName} ?: ${currentUser.login}">Користувач</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/cabinet}">
                            <i class="bi bi-grid me-2"></i>Кабінет
                        </a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" th:href="@{/logout}">
                            <i class="bi bi-box-arrow-right me-2"></i>Вихід
                        </a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ═══════════════════════════════════
     ОСНОВНИЙ КОНТЕНТ
     ═══════════════════════════════════ -->
<main class="py-4">
    <div class="container">
        <div layout:fragment="content">
            <!-- Тут буде контент кожної конкретної сторінки -->
        </div>
    </div>
</main>

<!-- ═══════════════════════════════════
     ФУТЕР
     ═══════════════════════════════════ -->
<footer class="bg-light border-top mt-auto py-4">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6 text-muted small">
                © 2025 SmartSchool. Інформаційна система закладу освіти.
            </div>
            <div class="col-md-6 text-md-end small text-muted">
                <i class="bi bi-envelope me-1"></i> office@school.ua
                <span class="mx-2">·</span>
                <i class="bi bi-telephone me-1"></i> +38 (000) 000-00-00
            </div>
        </div>
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
