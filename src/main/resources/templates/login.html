<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
  <title>Вхід — SmartSchool</title>
</head>
<body>

<div layout:fragment="content">

  <div class="form-card">
    <div class="text-center mb-4">
      <i class="bi bi-person-circle fs-1 text-primary"></i>
    </div>

    <h2>Вхід до системи</h2>
    <p class="subtitle">Увійдіть, щоб отримати доступ до особистого кабінету</p>

    <!-- Помилка авторизації -->
    <div th:if="${authError}" class="alert alert-danger d-flex align-items-center" role="alert">
      <i class="bi bi-exclamation-circle-fill me-2"></i>
      <span th:text="${authError}">Невірний логін або пароль</span>
    </div>

    <form method="post" th:object="${loginForm}">

      <div class="mb-3">
        <label class="form-label">
          <i class="bi bi-person me-1"></i> Логін
        </label>
        <input type="text"
               class="form-control"
               th:field="*{login}"
               placeholder="Введіть ваш логін"
               autofocus />
        <small class="text-danger d-block mt-1"
               th:if="${#fields.hasErrors('login')}"
               th:errors="*{login}"></small>
      </div>

      <div class="mb-4">
        <label class="form-label">
          <i class="bi bi-lock me-1"></i> Пароль
        </label>
        <input type="password"
               class="form-control"
               th:field="*{password}"
               placeholder="••••••••" />
        <small class="text-danger d-block mt-1"
               th:if="${#fields.hasErrors('password')}"
               th:errors="*{password}"></small>
      </div>

      <button type="submit" class="btn btn-primary w-100 btn-lg">
        <i class="bi bi-box-arrow-in-right me-2"></i> Увійти
      </button>
    </form>

    <hr class="my-4">

    <div class="text-center">
      <small class="text-muted">
        Ще не маєте облікового запису?
      </small>
      <br>
      <a th:href="@{/register}" class="text-decoration-none fw-semibold">
        Зареєструватися
      </a>
    </div>
  </div>

</div>

</body>
</html>
